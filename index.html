<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Inventory AI</title>
    <style>
        :root {
            --primary: #60a5fa;
            --primary-dark: #3b82f6;
            --secondary: #94a3b8;
            --bg-light: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text-main: #f1f5f9;
            --text-sub: #cbd5e1;
            --danger: #f87171;
            --success: #34d399;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-light); color: var(--text-main); }
        
        /* Layout */
        .app-container { display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1rem; }
        .main-content { flex: 1; overflow-y: auto; padding: 2rem; }
        
        /* Components */
        .nav-item { padding: 0.75rem 1rem; border-radius: 6px; cursor: pointer; color: var(--text-sub); margin-bottom: 0.5rem; transition: all 0.2s; font-weight: 500; }
        .nav-item:hover { background: var(--border); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: #0f172a; } /* Dark text on bright active primary */
        
        .card { background: var(--surface); border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        
        .btn { padding: 0.5rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; transition: 0.2s; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: #0f172a; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: var(--border); }
        .btn-danger { background: var(--danger); color: #fff; }
        
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-sub); font-weight: 500; }
        .input-control { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; background: var(--bg-light); color: var(--text-main); }
        .input-control:focus { outline: none; border-color: var(--primary); ring: 2px solid var(--primary); }
        
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .data-table th { text-align: left; padding: 0.75rem; border-bottom: 2px solid var(--border); color: var(--text-sub); font-weight: 600; }
        .data-table td { padding: 0.75rem; border-bottom: 1px solid var(--border); }
        .data-table tr:hover { background-color: var(--border); }
        
        .badge { padding: 0.25rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-active { background: #064e3b; color: #6ee7b7; }
        .badge-maintenance { background: #451a03; color: #fcd34d; }
        .badge-retired { background: #450a0a; color: #fca5a5; }

        .spinner { border: 2px solid #334155; border-top: 2px solid var(--primary); border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .ai-panel { background: linear-gradient(135deg, #172554 0%, #1e3a8a 100%); border: 1px solid #2563eb; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .stat-card { background: var(--surface); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
        .stat-label { font-size: 0.875rem; color: var(--text-sub); }

        @media print {
            .sidebar, .no-print, .ai-panel { display: none !important; }
            .app-container { height: auto; display: block; }
            .main-content { padding: 0; overflow: visible; }
            body { background: white; color: black; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .card { box-shadow: none; border: none; padding: 0; margin: 0; background: white; color: black; }
            .data-table th { border-bottom: 2px solid #000; color: #000; }
            .data-table td { border-bottom: 1px solid #ddd; color: #000; }
            h1, h2, h3 { color: #000 !important; }
            .stat-value, .stat-label { color: #000 !important; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",

  }

</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
